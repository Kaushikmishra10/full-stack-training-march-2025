<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating Forms Using Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <div class="container">
        <form action="#" class="needs-validation" novalidate>
            <div class="row row-cols-2 gy-4">
                <div class="col position-relative">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" name="name" minlength="3" id="name" required>
                    <div class="invalid-tooltip">
                        Enter full name and must have minimum 3 characters.
                    </div>
                </div>
                <div class="col position-relative">
                    <label for="contact" class="form-label">Contact number</label>
                    <input type="tel" class="form-control" pattern="^[6-9][0-9]{9}$" name="contact" id="contact" required>
                    <div class="invalid-tooltip">
                        Enter a valid 10-digit number
                    </div>
                </div>
                <div class="col">
                    <label for="dob" class="form-label">DOB</label>
                    <input type="date" class="form-control" max="2005-12-10" name="dob" id="dob" required>
                </div>
                <div class="col">
                    <div class="form-floating">
                        <input type="email" class="form-control" pattern="[a-zA-Z0-9._%+-]+@indixpert\.com$" placeholder="email" name="email" id="email" required>
                        <label for="email" class="form-label">Email Address</label>
                    </div>
                </div>
                <div class="col">
                    <label for="gender">Gender</label><br>
                    <div class="form-check form-check-inline">
                        <input type="radio" class="form-check-input" id="male" value="male" name="gender" required>
                        <label for="male" class="form-check-label">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="radio" class="form-check-input" id="female" value="female" name="gender">
                        <label for="female" class="form-check-label">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="radio" class="form-check-input" id="others" value="others" name="gender">
                        <label for="others" class="form-check-label">Others</label>
                    </div>
                </div>
                <div class="col">
                    <label for="skilss">Skills</label><br>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="c" value="c" name="c">
                            <label for="c" class="form-check-label">C</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="python" value="python" name="python">
                            <label for="python" class="form-check-label">Python</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="html" value="html" name="html">
                            <label for="html" class="form-check-label">HTML</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="css" value="css" name="css">
                            <label for="css" class="form-check-label">CSS</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input" id="bootstrap" value="bootstrap" name="bootstrap">
                            <label for="bootstrap" class="form-check-label">Bootstrap</label>
                        </div>
                    </label>
                </div>
                <div class="col">
                    <label for="city" class="form-label">City</label>
                    <select name="city" id="city" class="form-select" required>
                        <option value="">Select City</option>
                        <option value="delhi">Delhi</option>
                        <option value="gurgaon">Gurgaon</option>
                        <option value="jaipur">Jaipur</option>
                        <option value="bikaner">Bikaner</option>
                        <option value="amritsar">Amritsar</option>
                        <option value="mumbai">Mumbai</option>
                        <option value="bangalore">Bangalore</option>
                    </select>
                </div>
                <div class="col position-relative">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label for="terms" class="form-check-label">I agree to the <a href="#">Terms and Conditions</a></label>
                    <div class="invalid-tooltip">
                        Accept the term and conditions.
                    </div>
                </div>    
                <input type="submit" value="submit">


            </div>
        </form> 
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        // Example starter JavaScript for disabling form submissions if there are invalid fields
(() => {
  'use strict'

  // Fetch all the forms we want to apply custom Bootstrap validation styles to
  const forms = document.querySelectorAll('.needs-validation')

  // Loop over them and prevent submission
  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }

      form.classList.add('was-validated')
    }, false)
  })
})()
    </script>
</body>
</html>
