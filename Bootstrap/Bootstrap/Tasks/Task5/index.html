<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Making Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <main>
        <div class="container position-relative">
            <nav class="d-flex align-items-center justify-content-between">
                <a href="index.html" class="link-underline link-underline-opacity-0 fw-bold text-dark h4">KAUSHIK
                    MISHRA</a>
                <div class="d-flex align-items-center gap-5">
                    <ul class="d-flex align-items-center gap-5 list-unstyled">
                        <li><a href="#"
                                class="link-underline text-dark fw-semibold fs-5 link-underline-opacity-0">Home</a></li>
                        <li><a href="#" class="link-underline text-dark fw-semibold fs-5 link-underline-opacity-0">About
                                us</a></li>
                        <li><a href="#"
                                class="link-underline text-dark fw-semibold fs-5 link-underline-opacity-0">Contact</a>
                        </li>
                        <li>
                            <div class="btn-group">
                                <a href="https://indixpert.com" target="_blank" type="button"
                                    class="btn fw-semibold fs-5">Services</a>
                                <button type="button" class="btn dropdown-toggle dropdown-toggle-split"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    <span class="visually-hidden">Toggle Dropdown</span>
                                </button>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="#">Service 1</a></li>
                                    <li><a class="dropdown-item" href="#">Service 2</a></li>
                                    <li><a class="dropdown-item" href="#">Service 3</a></li>
                                    <li><a class="dropdown-item" href="#">Service 4</a></li>
                                </ul>
                            </div>
                        </li>
                        <li class="position-relative mt-2">
                            <p>
                                <img class="btn border" role="button" data-bs-toggle="collapse"
                                    data-bs-target="#collapseWidthExample" aria-expanded="false"
                                    aria-controls="collapseWidthExample" src="./images/search.png" alt="search img">
                            </p>
                            <div class="position-absolute end-0 top-0 h-100" style="min-height: 120px;">
                                <div class="collapse collapse-horizontal" id="collapseWidthExample">
                                    <div class="card card-body" style="width: 300px;">
                                        <form class="d-flex" role="search">
                                            <input class="form-control me-2" type="search" placeholder="Search"
                                                aria-label="Search">
                                            <button class="btn btn-outline-success" type="submit">Search</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>
            <section class="position-absolute top-0 start-0 z-n1">
                <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel"
                    data-bs-interval="2000" data-bs-pause="false">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <picture>
                                <source media="(max-width: 576px)" srcset="./images/mobile-img-1.jpg">
                                <source media="(max-width: 992px)" srcset="./images/tablet-img-1.jpg">
                                <source media="(min-width: 993px)" srcset="./images/img-1.jpg">
                                <img src="./images/img-1.jpg" class="d-block w-100" alt="Slide 1">
                            </picture>
                        </div>
                        <div class="carousel-item">
                            <picture>
                                <source media="(max-width: 576px)" srcset="./images/mobile-img-2.jpeg">
                                <source media="(max-width: 992px)" srcset="./images/tablet-img-2.jpeg">
                                <source media="(min-width: 993px)" srcset="./images/img-2.jpeg">
                                <img src="./images/img-2.jpeg" class="d-block w-100" alt="Slide 2">
                            </picture>
                        </div>
                        <div class="carousel-item">
                            <picture>
                                <source media="(max-width: 576px)" srcset="./images/mobile-img-3.jpeg">
                                <source media="(max-width: 992px)" srcset="./images/tablet-img-3.jpeg">
                                <source media="(min-width: 993px)" srcset="./images/img-3.jpeg">
                                <img src="./images/img-3.jpeg" class="d-block w-100" alt="Slide 3">
                            </picture>
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
