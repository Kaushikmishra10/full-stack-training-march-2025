<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .padding-y{
            padding-block: 20px;
        }
        h1{
            padding-bottom: 35px;
        }
        .form{
            padding-bottom: 25px;
        }
        .button1{
            background-color: blue;
            border: none;
            border-radius: 4px;
            color: white;
            padding-inline: 25px;
            box-shadow: 1px 1px 5px gray;
        }
        .button2{
            background-color: rgb(252, 181, 49);
            border: none;
            border-radius: 4px;
            color: white;
            padding-inline: 25px;
            box-shadow: 1px 1px 5px gray;

        }
        .button3{
            background-color: red;
            border: none;
            border-radius: 4px;
            color: white;
            padding: 7px 25px;
            box-shadow: 1px 1px 5px gray;

        }
        .button4{
            background-color: rgb(4, 183, 4);
            box-shadow: 1px 1px 5px gray;
            border: none;
            border-radius: 4px;
            color: white;
            padding: 7px 25px;
        }
        .head, .no{
            font-weight: 600;
        }
        .padding-left{
            padding-left: 30px;
        }
    </style>

</head>
<body>
    <main>
        <div class="container">
            <h1 class="text-center">To Do App</h1>
            <div class="form d-flex gap-3 justify-content-center">
                <form action="#">
                    <input type="text" class="form-control" placeholder="Enter a task here">
                </form>
                <button class="button1">Save</button>
                <button class="button2">Get Tasks</button>
            </div>
            <div class="row">
                <div class="head row padding-y">
                    <div class="col-2 padding-left">No.</div>
                    <div class="col-4">Todo item</div>
                    <div class="col-2">Status</div>
                    <div class="col-4">Actions</div>
                </div>
                <div class="border-bottom"></div>
                <div class="row padding-y">
                    <div class="no col-2 padding-left">1</div>
                    <div class="col-4 text-secondary">Buy groceries for next week</div>
                    <div class="col-2 text-secondary">In progress</div>
                    <div class="d-flex gap-2 col-4">
                        <button class="button3">Delete</button>
                        <button class="button4">Finished</button>
                    </div>
                </div>
                <div class="border-bottom"></div>
                <div class="row padding-y">
                    <div class="no col-2 padding-left">2</div>
                    <div class="col-4 text-secondary">Renew car insurance</div>
                    <div class="col-2 text-secondary">In progress</div>
                    <div class="d-flex gap-2 col-4">
                        <button class="button3">Delete</button>
                        <button class="button4">Finished</button>
                    </div>
                </div>
                <div class="border-bottom"></div>
                <div class="row padding-y">
                    <div class="no col-2 padding-left">3</div>
                    <div class="col-4 text-secondary">Signup for online course</div>
                    <div class="col-2 text-secondary">In progress</div>
                    <div class="d-flex gap-2 col-4">
                        <button class="button3">Delete</button>
                        <button class="button4">Finished</button>
                    </div>
                </div>
                <div class="border-bottom"></div>
            </div>
        </div>
    </main>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
