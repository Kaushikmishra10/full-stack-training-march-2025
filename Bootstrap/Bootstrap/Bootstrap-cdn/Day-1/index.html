<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Introduction day 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .box{
            height: 60px;
            border: solid 1px black;
            background-color: red;
        }
        .back{
            background-color: blanchedalmond;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Equal width Columns</h1>
        <div class="row row-cols-4 g-3">
            <div class="col-3"><div class="box"></div></div>
            <div class="col-3"><div class="box"></div></div>
            <div class="col-3"><div class="box"></div></div>
            <div class="col-3"><div class="box"></div></div>
            <div class="col-3"><div class="box"></div></div>
            <div class="col-3"><div class="box"></div></div>
            <div class="col-3"><div class="box"></div></div>
        </div>
        <div class="container">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5">
                <div class="box col"></div>
                <div class="box col"></div>
                <div class="box col"></div>
                <div class="box col"></div>
                <div class="box col"></div>
                <div class="box col"></div>
            </div>
        </div>
        <h2>Unequal Width Columns</h2>
        <div class="row">
            <div class="box col-lg-7"></div>
            <div class="box col-lg-5"></div>
        </div>
    </div>
    <div class="container-fluid back">    <!-- container-lg will give the 100% width of the viewport before 992px.  -->
        <!-- There are three containers (.container, .container-{breakpoint-infix, .container-fluid}) [.container take the assigned width of the viewport], [.container-{breakpoint-infix} will the give the full width of the viewport before breakpoint-infix], 
        [.container-fluid will take the 100% width of viewport at every breakpoints]. -->
        <h2>Lorem ipsum dolor sit amet.</h2>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
