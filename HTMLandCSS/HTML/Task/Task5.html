<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
</head>
<body>
    <h1>User Registration Form</h1>
    <form action="" method="get" >
        <div >
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter Name" name="fullName" required>
        </div>
        <br>
        <div >
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="input Email" name="email" required>
        </div>
        <br>
        <div >
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="input Password" name="password" required minlength="8">
        </div>
        <br>
        <div >
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="input Confirm Password" name="confirmPassword" required>
        </div>
        <br>
        <div >
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" placeholder="input DOB" name="dob" required>
        </div>
        <br>
        <div >
            <label>Gender</label>
            <label for="male"><input type="radio" id="male" name="gender" value="Male"> Male</label>
            <label for="female"><input type="radio" id="female" name="gender" value="Female"> Female</label>
            <label for="other"><input type="radio" id="other" name="gender" value="Other"> Other</label>
        </div>
        <br>
        <div >
            <label>Interests</label>
            <label for="coding"><input type="checkbox" id="coding" name="interests" value="Coding"> Coding</label>
            <label for="music"><input type="checkbox" id="music" name="interests" value="Music"> Music</label>
            <label for="sports"><input type="checkbox" id="sports" name="interests" value="Sports"> Sports</label>
            <label for="reading"><input type="checkbox" id="reading" name="interests" value="Reading"> Reading</label>
        </div>
        <br>
        <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country" required>
                <option value="">Select a country</option>
                <option value="USA">USA</option>
                <option value="Canada">Canada</option>
                <option value="UK">UK</option>
                <option value="Australia">Australia</option>
                <option value="India">India</option>
            </select>
        </div>
        <br>
        <div class="form-group">
            <label for="profilePicture">Profile Picture</label>
            <input type="file" id="profilePicture" name="profilePicture" accept="image/*" required>
        </div>
        <br>
        <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="4" placeholder="Tell us about yourself (optional)"></textarea>
        </div>
        <br>
        <div class="form-group terms-group">
            <label for="terms">
                <input type="checkbox" id="terms" name="terms" required> I agree to the Terms and Conditions</a>
            </label>
        </div>
        <br>
        <input type="submit">Register</input>
    </form>
</body>
</html>
