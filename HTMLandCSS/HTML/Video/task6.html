<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML MEDIA ELEMENT</title>
</head>
<body>
    <header>
        <h1>HTML Media Elements & Iframes</h1>
    </header>
    <main>
        <div>
            <img src="./assets/image1.jpeg" width="400" height="400" alt="wallpaper">

        <div>
            <audio src="./assets/audio.mp3" controls></audio>
        </div>

        <div>
            <video src="./assets/videoplayback.mp4" controls autoplay></video>

        <br>
        <div>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3563.951873588019!2d77.89570557521714!3d26.71398442676611!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3973ff119792738f%3A0x80821d54951f9e0d!2sSunder%20Colony%2C%20Dholpur%2C%20Rajasthan%20328001!5e0!3m2!1sen!2sin!4v1743591980164!5m2!1sen!2sin" width="300" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

        <br>
    
    </main>

</html>
