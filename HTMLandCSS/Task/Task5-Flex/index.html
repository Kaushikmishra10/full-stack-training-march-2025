<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/CSS/style.css">
    <title>FlexBox Design</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="flex-container">
                <div class="flex-items1"></div>
                <div class="flex-items2">
                    <div class="body1"></div>
                    <div class="body2">
                        <div class="left-side">
                            <div class="box1">
                                <div class="box1-part1"></div>
                                <div class="box1-part2"></div>
                                <div class="box1-part3"></div>
                            </div>
                            <div class="box2">
                                <div class="box2-part1"></div>
                                <div class="box2-part2"></div>
                            </div>
                        </div>
                        <div class="right-side">
                            <div class="box-top"></div>
                        </div>
                    </div>
                    <div class="body3">
                        <div class="body3-box1"></div>
                        <div class="body3-box2">
                            <div class="body3-box2-part"></div>
                        </div>
                        <div class="body3-box3"></div>
                        <div class="body3-box4"></div>
                        <div class="body3-box5"></div>
                    </div>                   
                </div>
            </div>
        </div>
    </main>
</body>
</html>
